# Fleet node registry for scripts/fleet.sh (bead ob-8ms.4).
#
# DELIBERATELY CONTAINS NO CREDENTIALS. The second column is an ssh alias, so
# usernames, hostnames, ports and key paths live in your ~/.ssh/config, which is
# not in this repo. A device sudo password was once committed to this project
# (bead ob-3i5) and is still in git history; that must not happen twice.
#
# Example ~/.ssh/config entry:
#   Host orion-j2
#       HostName 192.168.1.42
#       User orion
#       IdentityFile ~/.ssh/id_orion
#
# Columns:
#   name     short node name, used in output filenames
#   ssh      ssh alias (must resolve from your ssh config)
#   cluster  which CPU cluster to pin to: big | little | all
#            "big"/"little" are RESOLVED ON THE NODE from cpufreq/cpuinfo_max_freq,
#            never assumed — DEVICE_RUNBOOK is explicit that cpu0-3 is not reliably
#            the little cluster, and it is board-dependent.
#   label    prefix for result files, e.g. jetson-j2 -> results/raw/jetson-j2_st.csv
#
# name  ssh         cluster  label
j1      orion-j1    all      jetson-j1
j2      orion-j2    all      jetson-j2
t3      orion-t3    big      rk3588-t3
t4      orion-t4    big      rk3588-t4
# r5 (Raspberry Pi 5) is omitted: not responding as of 2026-08-04. See ob-4qz.1 —
# it was ADR 0005's reproducibility control and the 17 GB/s point on the
# bandwidth axis, so its loss is a decision, not just a missing row.
