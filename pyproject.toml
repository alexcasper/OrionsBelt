[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "orionsbelt"
version = "0.1.0"
description = "Optimizing a Qwen3.5 Gated DeltaNet hybrid model for Arm silicon (CIX P1 / Orion O6)."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [
    { name = "OrionsBelt contributors" },
]
keywords = ["gated-deltanet", "arm", "npu", "inference", "quantization"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: POSIX :: Linux",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# Keep runtime deps minimal: this is the set that
# must install inside the CIX NOE Compiler toolchain environment (see
# docs/CLAIM_VERIFICATION.md section 2.2a: the NOE Compiler requires Python 3.10
# (VERIFIED against Radxa docs — the "Python 3.8" figure in brief.md was wrong).
# unverified, so we design for it rather than assert it as confirmed).
# Heavy ML deps (torch, transformers, weights) are deliberately NOT pinned
# here; they land with bead t-weights-fetch.
dependencies = [
    "numpy>=1.20",
]

[project.optional-dependencies]
# Local development tooling: linting, formatting, pre-commit. Targets modern
# Python only — never assumed to run under the NOE 3.10 toolchain.
dev = [
    "pytest>=7.0",
    "ruff>=0.5",
    "pre-commit>=3.5",
]
# Benchmark harness and reference inference stack: modern Python, heavier
# numerical/plotting stack. Also not required on the NPU side.
bench = [
    "pandas>=1.3",
    "matplotlib>=3.5",
]
# NPU-side extras layered on the minimal runtime; NOE SDK needs a 3.10 venv
# deps above. Kept separate and intentionally thin: the CIX NOE Compiler
# toolchain is the constrained environment, so this group should never pull
# in anything that isn't safe under Python 3.10.
npu = []

[project.urls]
Repository = "https://github.com/OrionsBelt/OrionsBelt"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "bench", "tests", "scripts"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade (flags anything not py310-safe given target-version)
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
]
ignore = [
    "E501",  # line length is enforced by the formatter, not worth double-flagging
]

[tool.ruff.lint.isort]
known-first-party = ["orionsbelt"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
python_files = ["test_*.py"]
pythonpath = ["bench"]
